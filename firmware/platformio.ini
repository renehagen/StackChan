[platformio]
default_envs = stackchan

[env:stackchan]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
board_build.embed_files = art/face.rgb565
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DWEBSOCKETS_TCP_TIMEOUT=5000
lib_deps =
    m5stack/M5Unified@0.2.12
    m5stack/M5GFX@0.2.36
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@7.4.2
